# yaml-language-server: $schema=https://coderabbit.ai/integrations/schema.v2.json
# CodeRabbit configuration for STAM-notification
# Idempotent Kafka consumer -> Thymeleaf templates -> SMTP.
language: en-US
early_access: false

reviews:
  profile: assertive
  request_changes_workflow: false
  high_level_summary: true
  poem: false
  review_status: true
  collapse_walkthrough: true
  auto_review:
    enabled: true
    drafts: false
    base_branches:
      - "Dev"
      - "main"

  path_filters:
    - "!**/target/**"
    - "!**/.idea/**"

  path_instructions:
    - path: "notification/src/main/java/com/stampedeio/notification/**"
      instructions: >
        This consumer listens on reservations.events and Kafka redelivers, so
        a non-idempotent send means a customer gets the same email twice.
        Dedup is enforced via the processed_events table through
        IdempotencyService. The current shape is send-then-record, which has a
        narrow double-send window if the process dies between the SMTP send and
        the processed_events write - acceptable for Mailhog, not for a real
        relay. Flag as a must-fix: (1) a new event type handled without any
        processed_events check at all; (2) a send failure that still writes the
        processed_events row, silently dropping the notification; (3) removal
        of the dedup check. Flag as a discussion point, not a must-fix, any
        change that widens the send/record window (e.g. batching sends) - the
        real fix is a claimed/pending state or a transactional outbox before
        dispatch, which is out of scope for a single PR unless the PR is
        explicitly doing that.
        Note the topic naming inconsistency in this project: a
        notifications.requests topic exists in compose but nothing produces or
        consumes it - flag any code that starts using it without the compose
        wiring being fixed in the same change, and flag any assumption that it
        is already live.

    - path: "notification/src/main/resources/templates/email/**"
      instructions: >
        Thymeleaf email templates. Flag any use of th:utext with
        user-controlled data - that is unescaped output and an HTML injection
        vector in an email client. Prefer th:text. Flag hardcoded absolute
        URLs pointing at localhost or a developer machine, and any customer
        PII rendered beyond what the notification actually needs.

    - path: "notification/src/main/resources/db/migration/*.sql"
      instructions: >
        Flyway is forward-only - flag edits to already-merged migrations. Flag
        any change weakening uniqueness on the processed_events key, which is
        what prevents duplicate sends.

    - path: "notification/src/test/java/**"
      instructions: >
        NotificationConsumerIT proves the dedup claim. Flag added @Disabled,
        loosened assertions, or a Testcontainers dependency replaced with a
        mock. A redelivery test that does not assert a single send is not
        testing dedup.

    - path: "**/*.{yml,yaml}"
      instructions: >
        spring.jpa.hibernate.ddl-auto must remain validate. Flag any hardcoded
        SMTP credential; a ${VAR:default} is only safe when `default` is
        non-sensitive (host, port, empty) - a default holding a real password
        is still a committed secret. Flag any mail host defaulting to a real
        relay instead of Mailhog for local development.

  tools:
    gitleaks:
      enabled: true
    yamllint:
      enabled: true
    markdownlint:
      enabled: true
    actionlint:
      enabled: true
    hadolint:
      enabled: true
    semgrep:
      enabled: true

chat:
  auto_reply: true

knowledge_base:
  learnings:
    scope: auto
  issues:
    scope: auto
